</style></head><body><main class="app"><section class="shell"><div class="top"><div class="eyebrow">one little wish · every day</div><h1>Hộp lời chúc cho babi 💜</h1><p class="subtitle">Mỗi ngày chỉ có một lời chúc dành cho đúng ngày hôm đó. Ngày mai quay lại sẽ có một điều mới đang đợi em.</p><div class="date" id="dateLabel"></div></div><div class="box"><div class="gift" id="gift">🎁</div><div class="day-title" id="dayTitle">Lời chúc hôm nay</div><p class="wish" id="wish"></p></div><div class="signature">for babi, from Papa 💜</div><div class="footer">made to be opened gently · one day at a time</div></section></main>
<script>
const wishes={"01-01": {"icon": "🌷", "text": "Chúc babi hôm nay thức dậy với một cái đầu thật nhẹ; việc khó thì từ từ giải quyết, còn việc chưa cần thiết cứ để mai tính. Tối về chỉ cần thấy: hôm nay cũng là một ngày đáng sống. 💜"}, "01-02": {"icon": "☁️", "text": "Mong hôm nay bắt đầu với em thật dịu dàng; công việc vừa sức, đường đi thuận lợi và bữa ăn nào cũng đúng món em thèm. Chỉ cần cuối ngày em thấy lòng nhẹ hơn lúc sáng là Papa vui rồi. 💜"}, "01-03": {"icon": "🫧", "text": "Chúc em bước vào ngày mới với lòng thật yên; mọi chuyện lộn xộn rồi cũng tìm được chỗ của nó, còn em thì cứ bình tĩnh thôi. Nếu mệt thì nghỉ một chút nha babi, không cần lúc nào cũng phải mạnh mẽ. 💜"}, "01-04": {"icon": "🍰", "text": "Mong ngày hôm nay dành cho babi nhiều khoảng thở dễ chịu; có món gì ngon để ăn, có điều gì vui để cười và có lúc được nghỉ thật sự. Papa chỉ gửi một lời chúc nhỏ vậy thôi: mong em vui. 💜"}, "01-05": {"icon": "✨", "text": "Chúc em có một ngày không cần phải vội; em có một khoảnh khắc bất ngờ khiến em tự nhiên mỉm cười. Phần còn lại cứ để ngày mai lo tiếp. Hôm nay bình yên trước đã. 💜"}, "01-06": {"icon": "🎀", "text": "Mong sáng nay em thấy mình được cuộc đời đối xử thật mềm; em có thêm một kỷ niệm nhỏ mà tối về nhớ lại vẫn thấy vui. Không cần hôm nay hoàn hảo, chỉ cần nó tử tế với em là được. 💜"}, "01-07": {"icon": "🌙", "text": "Chúc babi hôm nay có đủ năng lượng cho những điều em muốn làm; những chuyện làm em mệt sẽ nhỏ lại, còn những chuyện làm em vui sẽ ở lâu hơn. Mong một ngày bình thường của em cũng có vài phút thật đặc biệt. 💜"}, "01-08": {"icon": "🌼", "text": "Mong em bắt đầu hôm nay bằng một cảm giác thật bình an; có đủ tập trung khi cần cố gắng và đủ thảnh thơi khi đã đến lúc nghỉ. Và mong em luôn nhớ chăm sóc mình trước nha. 💜"}, "01-09": {"icon": "🍀", "text": "Chúc hôm nay là một ngày vừa đủ nhẹ với em; em thấy mình xinh, thấy mình giỏi và thấy những cố gắng của mình là có ý nghĩa. Mong em có thật nhiều lý do nhỏ xíu để mỉm cười hôm nay. 💜"}, "01-10": {"icon": "🪻", "text": "Mong ngày mới mang đến cho em một chút vui ngay từ đầu; em gặp những người tử tế, những câu nói dễ thương và những khoảnh khắc không phải nghĩ nhiều. Chúc em đi qua hôm nay thật êm và tối về ngủ một giấc thật ngon. 💜"}, "01-11": {"icon": "🌷", "text": "Chúc babi hôm nay thức dậy với một cái đầu thật nhẹ; những điều tốt đẹp tìm đến em theo cách rất bình thường nhưng vừa đúng lúc. Tối về chỉ cần thấy: hôm nay cũng là một ngày đáng sống. 💜"}, "01-12": {"icon": "☁️", "text": "Mong hôm nay bắt đầu với em thật dịu dàng; nếu có chuyện không vui, mong nó đi qua nhanh và không ở lại trong lòng em lâu. Chỉ cần cuối ngày em thấy lòng nhẹ hơn lúc sáng là Papa vui rồi. 💜"}, "01-13": {"icon": "🫧", "text": "Chúc em bước vào ngày mới với lòng thật yên; em có thể làm điều mình thích mà không phải giải thích hay chiều lòng bất kỳ ai. Nếu mệt thì nghỉ một chút nha babi, không cần lúc nào cũng phải mạnh mẽ. 💜"}, "01-14": {"icon": "🍰", "text": "Mong ngày hôm nay dành cho babi nhiều khoảng thở dễ chịu; em được ngủ đủ, ăn ngon và không bị ai làm phiền vào những lúc cần yên tĩnh. Papa chỉ gửi một lời chúc nhỏ vậy thôi: mong em vui. 💜"}, "01-15": {"icon": "✨", "text": "Chúc em có một ngày không cần phải vội; em gặp may ở một chuyện nho nhỏ, kiểu may mắn đủ để làm cả ngày đáng yêu hơn. Phần còn lại cứ để ngày mai lo tiếp. Hôm nay bình yên trước đã. 💜"}, "01-16": {"icon": "🎀", "text": "Mong sáng nay em thấy mình được cuộc đời đối xử thật mềm; những điều chưa như ý không lấy mất sự dễ thương của cả một ngày. Không cần hôm nay hoàn hảo, chỉ cần nó tử tế với em là được. 💜"}, "01-17": {"icon": "🌙", "text": "Chúc babi hôm nay có đủ năng lượng cho những điều em muốn làm; em nhớ dành một chút thời gian cho chính mình, dù hôm nay có bận đến đâu. Mong một ngày bình thường của em cũng có vài phút thật đặc biệt. 💜"}, "01-18": {"icon": "🌼", "text": "Mong em bắt đầu hôm nay bằng một cảm giác thật bình an; việc khó thì từ từ giải quyết, còn việc chưa cần thiết cứ để mai tính. Phần còn lại cứ để ngày mai lo tiếp. Hôm nay bình yên trước đã. 💜"}, "01-19": {"icon": "🍀", "text": "Chúc hôm nay là một ngày vừa đủ nhẹ với em; công việc vừa sức, đường đi thuận lợi và bữa ăn nào cũng đúng món em thèm. Không cần hôm nay hoàn hảo, chỉ cần nó tử tế với em là được. 💜"}, "01-20": {"icon": "🪻", "text": "Mong ngày mới mang đến cho em một chút vui ngay từ đầu; mọi chuyện lộn xộn rồi cũng tìm được chỗ của nó, còn em thì cứ bình tĩnh thôi. Mong một ngày bình thường của em cũng có vài phút thật đặc biệt. 💜"}, "01-21": {"icon": "🌷", "text": "Chúc babi hôm nay thức dậy với một cái đầu thật nhẹ; những chuyện làm em mệt sẽ nhỏ lại, còn những chuyện làm em vui sẽ ở lâu hơn. Và mong em luôn nhớ chăm sóc mình trước nha. 💜"}, "01-22": {"icon": "☁️", "text": "Mong hôm nay bắt đầu với em thật dịu dàng; có đủ tập trung khi cần cố gắng và đủ thảnh thơi khi đã đến lúc nghỉ. Mong em có thật nhiều lý do nhỏ xíu để mỉm cười hôm nay. 💜"}, "01-23": {"icon": "🫧", "text": "Chúc em bước vào ngày mới với lòng thật yên; em thấy mình xinh, thấy mình giỏi và thấy những cố gắng của mình là có ý nghĩa. Chúc em đi qua hôm nay thật êm và tối về ngủ một giấc thật ngon. 💜"}, "01-24": {"icon": "🍰", "text": "Mong ngày hôm nay dành cho babi nhiều khoảng thở dễ chịu; em gặp những người tử tế, những câu nói dễ thương và những khoảnh khắc không phải nghĩ nhiều. Tối về chỉ cần thấy: hôm nay cũng là một ngày đáng sống. 💜"}, "01-25": {"icon": "✨", "text": "Chúc em có một ngày không cần phải vội; em không phải ôm hết mọi thứ cùng một lúc; từng chuyện một là được rồi. Chỉ cần cuối ngày em thấy lòng nhẹ hơn lúc sáng là Papa vui rồi. 💜"}, "01-26": {"icon": "🎀", "text": "Mong sáng nay em thấy mình được cuộc đời đối xử thật mềm; điều em đang mong chờ tiến gần thêm một chút, dù chỉ là một bước rất nhỏ. Nếu mệt thì nghỉ một chút nha babi, không cần lúc nào cũng phải mạnh mẽ. 💜"}, "01-27": {"icon": "🌙", "text": "Chúc babi hôm nay có đủ năng lượng cho những điều em muốn làm; mọi thứ em cần làm đều trôi chảy hơn mộ const specials={"01-01": {"icon": "✨", "title": "Ngày đầu tiên của năm", "text": "Chúc babi một năm mới thật bình an. Mong 365 ngày phía trước có nhiều ngày em cười hơn những ngày em buồn, nhiều điều đáng mong chờ hơn những điều phải lo, và em vẫn luôn được sống theo cách khiến em thấy nhẹ lòng nhất. 💜"}, "01-16": {"icon": "🎂", "title": "Sinh nhật của babi", "text": "Happy birthday babi. 💜 Chúc em tuổi mới thật khỏe, thật bình yên, được làm những điều em muốn, đi những nơi em thích và luôn có những người thật lòng thương em ở bên. Mong những điều tốt đẹp em xứng đáng có sẽ tìm đến em — không chỉ hôm nay mà cả những ngày sau nữa."}, "02-14": {"icon": "💜", "title": "Valentine", "text": "Valentine này Papa chỉ chúc em được yêu thương theo cách làm em thấy bình yên nhất. Có hoa, có đồ ngon, có những điều dễ thương và quan trọng nhất là có một ngày em thật vui. 💜"}, "03-08": {"icon": "🌷", "title": "8 tháng 3", "text": "Chúc babi ngày 8/3 thật xinh và thật vui. Mong em luôn được trân trọng, được lắng nghe, được tự do là chính mình và có thật nhiều lý do để thấy cuộc sống này đáng yêu. 💜"}, "10-20": {"icon": "🌸", "title": "20 tháng 10", "text": "Chúc babi 20/10 thật dịu dàng. Mong hôm nay em nhận được nhiều sự quan tâm, nhiều niềm vui và nhớ rằng bản thân em cũng là một điều rất đáng được nâng niu. 💜"}, "12-24": {"icon": "🎄", "title": "Đêm Giáng Sinh", "text": "Merry Christmas babi. 🎄💜 Chúc em một đêm Noel ấm áp, ăn món mình thích, nghe nhạc mình yêu và có một tối thật yên. Mong Giáng Sinh năm nay để lại cho em một kỷ niệm thật đẹp."}, "12-31": {"icon": "🌙", "title": "Ngày cuối cùng của năm", "text": "Ngày cuối năm rồi. Chúc babi khép lại những chuyện đã mệt, giữ lại những điều đáng nhớ và bước sang năm mới thật nhẹ. Cảm ơn em vì đã đi hết một năm dài. Mong năm sau dịu dàng với em hơn nữa. 💜"}};
const specialDates={"2027-02-05": {"icon": "🧧", "title": "29 Tết", "text": "Sắp sang năm mới rồi babi. Chúc em bỏ lại những chuyện làm mình mệt ở năm cũ, dọn một chỗ thật rộng trong lòng cho niềm vui, may mắn và những điều mới thật đẹp. 💜"}, "2027-02-06": {"icon": "🧧", "title": "Mùng 1 Tết", "text": "Chúc mừng năm mới babi. 🧧💜 Chúc em một năm thật khỏe, thật nhiều tiền, công việc thuận lợi, gia đình bình an, ăn gì cũng ngon, đi đâu cũng vui và những điều em mong đều từng chút một thành hiện thực."}, "2027-02-07": {"icon": "🌸", "title": "Mùng 2 Tết", "text": "Mùng 2 rồi. Chúc babi hôm nay chỉ có ăn ngon, mặc đẹp, đi chơi vui và nhận thật nhiều lì xì. Mong cả năm của em cũng rực rỡ và nhẹ nhàng như mấy ngày đầu xuân. 💜"}, "2027-02-08": {"icon": "🍀", "title": "Mùng 3 Tết", "text": "Chúc babi mùng 3 thật vui. Mong may mắn của mấy ngày Tết theo em đi suốt cả năm, còn những chuyện phiền lòng thì ở lại phía sau hết nha. 💜"}};
function vietnamNow(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit',weekday:'long'}).formatToParts(new Date());const o={};parts.forEach(p=>o[p.type]=p.value);return o}
const n=vietnamNow(), md=n.month+'-'+n.day, full=n.year+'-'+n.month+'-'+n.day;
const data=specialDates[full]||specials[md]||wishes[md];
const viDays={Monday:'Thứ Hai',Tuesday:'Thứ Ba',Wednesday:'Thứ Tư',Thursday:'Thứ Năm',Friday:'Thứ Sáu',Saturday:'Thứ Bảy',Sunday:'Chủ Nhật'};
document.getElementById('dateLabel').textContent=`${viDays[n.weekday]||''}, ${n.day}/${n.month}/${n.year}`;
document.getElementById('gift').textContent=data.icon||'💜';document.getElementById('dayTitle').textContent=data.title||'Lời chúc hôm nay';document.getElementById('wish').textContent=data.text;

// GoatCounter: count one custom pageview for the exact wish/date being shown.
// no_onload prevents a duplicate generic pageview.
window.goatcounter = window.goatcounter || {};
window.goatcounter.no_onload = true;
window.__babiWishTracking = {
  path: `/wish/${full}`,
  title: `${data.title || 'Lời chúc hôm nay'} — ${full}`
};

(function trackTodaysWish(){
  let tries = 0;
  const timer = setInterval(function(){
    tries++;
    if (window.goatcounter && typeof window.goatcounter.count === 'function') {
      clearInterval(timer);
      window.goatcounter.count({
        path: window.__babiWishTracking.path,
        title: window.__babiWishTracking.title
      });
    } else if (tries >= 100) {
      clearInterval(timer);
    }
  }, 100);
})();
</script>
