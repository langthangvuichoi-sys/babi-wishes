<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4eaf5" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Hộp lời chúc cho babi 💜</title>
  
  <style>
    :root{
      --bg1:#eadcf3;
      --bg2:#f6dce9;
      --bg3:#fff4f7;
      --paper:rgba(255,250,253,.94);
      --ink:#5e4668;
      --muted:#957e9c;
      --lav:#a985b8;
      --lav-deep:#73557f;
      --pink:#e6aeca;
      --pink-soft:#f6d5e5;
      --line:#d4bedb;
      --shadow:0 24px 70px rgba(89,61,98,.18);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;color:var(--ink)}
    body{
      font-family:Inter,ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 13% 15%,rgba(255,255,255,.95) 0 2px,transparent 3px),
        radial-gradient(circle at 86% 17%,rgba(255,255,255,.8) 0 2px,transparent 3px),
        radial-gradient(circle at 74% 52%,rgba(255,255,255,.55) 0 1.5px,transparent 2.5px),
        linear-gradient(145deg,var(--bg1) 0%,var(--bg2) 48%,var(--bg3) 100%);
    }
    button{font:inherit;-webkit-tap-highlight-color:transparent}
    .app{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:18px;
      position:relative;
      overflow:hidden;
    }
    .app:before,.app:after{
      content:"";
      position:absolute;
      border-radius:50%;
      filter:blur(2px);
      pointer-events:none;
    }
    .app:before{
      width:260px;height:260px;
      left:-110px;top:-70px;
      background:rgba(255,255,255,.32);
    }
    .app:after{
      width:300px;height:300px;
      right:-130px;bottom:-120px;
      background:rgba(177,137,191,.12);
    }
    .shell{
      width:min(640px,100%);
      background:var(--paper);
      border:1.5px solid rgba(115,85,127,.55);
      border-radius:30px;
      box-shadow:0 0 0 7px rgba(255,255,255,.25),var(--shadow);
      padding:32px 24px 24px;
      backdrop-filter:blur(10px);
      position:relative;
      z-index:2;
    }
    .shell:before{
      content:"♡";
      position:absolute;
      top:-18px;left:50%;
      transform:translateX(-50%);
      width:46px;height:38px;
      display:grid;place-items:center;
      border-radius:18px;
      background:#f7d5e5;
      color:#8d6a98;
      border:1px solid rgba(115,85,127,.3);
      font-size:22px;
      box-shadow:0 8px 18px rgba(89,61,98,.12);
    }
    .top{text-align:center;margin-bottom:20px}
    .eyebrow{
      letter-spacing:.2em;
      text-transform:uppercase;
      font-size:11px;
      font-weight:850;
      color:var(--muted);
      margin:6px 0 10px;
    }
    h1{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(32px,7vw,46px);
      line-height:1.08;
      letter-spacing:-.025em;
      font-weight:700;
    }
    .subtitle{
      margin:13px auto 0;
      max-width:470px;
      color:var(--muted);
      font-size:15px;
      line-height:1.65;
    }
    .today-btn{
      display:block;
      margin:20px auto 0;
      border:1.5px solid var(--lav-deep);
      background:linear-gradient(180deg,#896894,#765680);
      color:#fff;
      padding:12px 20px;
      border-radius:999px;
      font-weight:800;
      box-shadow:0 7px 0 rgba(92,72,100,.12);
      cursor:pointer;
      transition:.16s ease;
    }
    .today-btn:hover{transform:translateY(-1px)}
    .today-btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(92,72,100,.12)}

    .grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:8px;
      margin-top:23px;
    }
    .day{
      border:1.5px solid var(--line);
      background:linear-gradient(180deg,#fff,#fff7fb);
      border-radius:17px;
      min-height:80px;
      padding:10px 5px 8px;
      cursor:pointer;
      color:var(--ink);
      transition:.18s ease;
      box-shadow:0 5px 12px rgba(85,58,92,.05);
    }
    .day:nth-child(2n){background:linear-gradient(180deg,#fff,#faf4fd)}
    .day:hover{transform:translateY(-2px)}
    .day.active{
      border-color:#8c6a98;
      background:linear-gradient(180deg,#f1d8e9,#eadbf4);
      box-shadow:0 9px 24px rgba(95,70,104,.13);
      transform:translateY(-2px);
    }
    .day .short{display:block;font-weight:900;font-size:13px}
    .day .heart{display:block;font-size:18px;margin-top:7px;color:#c68cab;opacity:.5}
    .day.active .heart{opacity:1;transform:scale(1.08)}
    .day .tiny{display:block;margin-top:5px;font-size:9px;color:var(--muted);min-height:11px}

    .box{
      margin-top:20px;
      border:1.5px solid rgba(141,106,152,.48);
      background:
        radial-gradient(circle at 50% 0%,rgba(255,255,255,.85),transparent 48%),
        linear-gradient(180deg,#fffafd 0%,#fdf2f8 100%);
      border-radius:24px;
      padding:24px 20px;
      min-height:280px;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:center;
      text-align:center;
      box-shadow:inset 0 0 35px rgba(230,174,202,.08);
    }
    .box:before,.box:after{
      content:"";
      position:absolute;
      width:160px;height:160px;
      border-radius:50%;
      pointer-events:none;
    }
    .box:before{top:-100px;right:-60px;background:rgba(230,174,202,.16)}
    .box:after{bottom:-110px;left:-60px;background:rgba(169,133,184,.13)}

    .gift{
      position:relative;
      z-index:1;
      width:72px;height:62px;
      margin:0 auto 16px;
      display:grid;place-items:center;
      font-size:38px;
      background:linear-gradient(180deg,#f5cfe1,#e9b6d0);
      border:1px solid rgba(115,85,127,.3);
      border-radius:15px;
      box-shadow:0 8px 20px rgba(102,71,109,.12);
    }
    .gift:before{
      content:"";
      position:absolute;
      width:12px;height:100%;
      background:rgba(142,105,153,.35);
      left:50%;transform:translateX(-50%);
    }
    .gift:after{
      content:"";
      position:absolute;
      width:100%;height:11px;
      background:rgba(142,105,153,.28);
      top:18px;left:0;
    }
    .day-title{
      position:relative;z-index:1;
      font-size:11px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:12px;
    }
    .wish{
      position:relative;z-index:1;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(20px,5.2vw,27px);
      line-height:1.58;
      max-width:510px;
      margin:0 auto;
      opacity:0;
      transform:translateY(7px) scale(.99);
      transition:.28s ease;
    }
    .wish.show{opacity:1;transform:none}
    .hint{
      position:relative;z-index:1;
      margin-top:18px;
      color:var(--muted);
      font-size:12px;
    }
    .signature{
      text-align:center;
      margin-top:22px;
      font-family:Georgia,"Times New Roman",serif;
      font-style:italic;
      color:#866b90;
      font-size:15px;
    }
    .footer{
      text-align:center;
      font-size:10px;
      color:#ad99b1;
      margin-top:12px;
      letter-spacing:.09em;
    }
    @media(max-width:560px){
      .app{padding:10px}
      .shell{padding:28px 14px 20px;border-radius:24px}
      .grid{gap:5px}
      .day{min-height:70px;border-radius:13px;padding:9px 2px 7px}
      .day .short{font-size:11px}
      .day .heart{font-size:15px}
      .day .tiny{font-size:8px}
      .box{padding:20px 15px;min-height:275px}
      .gift{width:64px;height:56px;font-size:34px}
    }
  </style>

</head>
<body>
  <main class="app">
    <section class="shell">
      <div class="top">
        <div class="eyebrow">7 little wishes</div>
        <h1>Hộp lời chúc cho babi 💜</h1>
        <p class="subtitle">Mỗi ngày một lời chúc nhỏ. Không cần trả lời gì hết — mở ra khi em muốn thôi.</p>
        <button class="today-btn" id="todayBtn">Mở lời chúc hôm nay</button>
      </div>

      <div class="grid" id="dayGrid">
        <button class="day" data-day="1"><span class="short">T2</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="2"><span class="short">T3</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="3"><span class="short">T4</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="4"><span class="short">T5</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="5"><span class="short">T6</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="6"><span class="short">T7</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="0"><span class="short">CN</span><span class="heart">♡</span><span class="tiny"></span></button>
      </div>

      <div class="box">
        <div class="gift" id="gift">🎁</div>
        <div class="day-title" id="dayTitle">Một lời chúc đang đợi em</div>
        <p class="wish" id="wish">Bấm vào một ngày ở trên để mở nha.</p>
        <div class="hint" id="hint">Mỗi ngày đều có một cái nhỏ xíu dành cho em.</div>
      </div>

      <div class="signature">for babi, from Papa 💜</div>
      <div class="footer">made to be opened gently</div>
    </section>
  </main>

  <script>
    const wishes = {
      1:{
        title:"Thứ Hai",
        icon:"🌷",
        text:"Chúc babi bắt đầu tuần mới thật nhẹ. Việc gì khó thì làm từ từ, việc gì mệt thì để nó nhẹ lại một chút. Mong hôm nay đối xử với em thật dịu dàng."
      },
      2:{
        title:"Thứ Ba",
        icon:"☁️",
        text:"Chúc hôm nay có một điều nhỏ xíu làm em vui bất ngờ — một món ngon, một câu nói dễ thương, hay đơn giản là một khoảnh khắc em thấy lòng mình nhẹ tênh."
      },
      3:{
        title:"Thứ Tư",
        icon:"🫧",
        text:"Giữa tuần rồi. Chúc em vẫn còn đủ năng lượng cho những điều em muốn làm, và đủ dịu dàng với chính mình cho những điều chưa kịp làm."
      },
      4:{
        title:"Thứ Năm",
        icon:"🍰",
        text:"Chúc em gặp nhiều điều tử tế hơn những điều làm em mệt. Và nếu hôm nay không hoàn hảo, thì ít nhất mong nó vẫn có một đoạn thật ngon, thật vui, thật đáng nhớ."
      },
      5:{
        title:"Thứ Sáu",
        icon:"✨",
        text:"Chúc em khép lại tuần này với cảm giác: mình đã cố gắng đủ rồi. Phần còn lại để ngày mai tính. Tối nay cứ vui trước đã nha."
      },
      6:{
        title:"Thứ Bảy",
        icon:"🎀",
        text:"Chúc hôm nay là một ngày thật xinh — được đi nơi em thích, ăn món em muốn, làm điều em vui, và không cần vội với bất kỳ ai."
      },
      0:{
        title:"Chủ Nhật",
        icon:"🌙",
        text:"Chúc em có một ngày để thở thật sâu, nghỉ thật yên, và làm đầy lại những phần đã hơi mệt trong tuần. Ngày mai tính sau. Hôm nay cứ bình yên trước đã. 💜"
      }
    };

    const dayButtons = [...document.querySelectorAll(".day")];
    const wishEl = document.getElementById("wish");
    const titleEl = document.getElementById("dayTitle");
    const giftEl = document.getElementById("gift");
    const hintEl = document.getElementById("hint");
    const todayBtn = document.getElementById("todayBtn");

    const today = new Date().getDay();

    function markToday(){
      dayButtons.forEach(btn=>{
        const d = Number(btn.dataset.day);
        const tiny = btn.querySelector(".tiny");
        tiny.textContent = d === today ? "hôm nay" : "";
      });
    }

    function openWish(day){
      const data = wishes[day];
      if(!data) return;
      dayButtons.forEach(btn=>btn.classList.toggle("active",Number(btn.dataset.day)===day));
      wishEl.classList.remove("show");
      setTimeout(()=>{
        titleEl.textContent = data.title;
        giftEl.textContent = data.icon;
        wishEl.textContent = data.text;
        hintEl.textContent = day===today ? "Lời chúc của hôm nay 💜" : "Lời chúc nhỏ của ngày này.";
        wishEl.classList.add("show");
      },120);
    }

    dayButtons.forEach(btn=>{
      btn.addEventListener("click",()=>openWish(Number(btn.dataset.day)));
    });

    todayBtn.addEventListener("click",()=>openWish(today));

    markToday();
    setTimeout(()=>openWish(today),250);
  </script>
  <script data-goatcounter="https://nbin.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
