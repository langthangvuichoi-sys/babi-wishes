<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}

.footer{text-align:center;font-size:10px;color:#b5a3b9;margin-top:13px;letter-spacing:.08em}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:560px){.app{padding:10px}.shell{padding:27px 14px 21px;border-radius:22px}.box{padding:24px 15px;min-height:300px}}

<main class="app"><section class="shell">

<div class="signature">for babi, from Papa 💜</div><div class="footer">made to be opened gently · one day at a time</div>
</section></main>

function vietnamNow(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit',weekday:'long'}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return o}
function dayIndex(y,m,d){return Math.floor((Date.UTC(y,m-1,d)-Date.UTC(2026,0,1))/86400000)}
function genericWish(y,m,d){let i=dayIndex(y,m,d);if(i<0)i=Math.abs(i);const a=i%openings.length;const b=Math.floor(i/openings.length)%middles.length;const c=Math.floor(i/(openings.length*middles.length))%endings.length;return{icon:icons[i%icons.length],title:'Lời chúc hôm nay',text:`${openings[a]} ${middles[b]} ${endings[c]}`}}
function birthdayWish(y){const age=y-2001,k=y-2026;return{icon:'🎂',title:`Sinh nhật ${age} tuổi của babi`,text:`Happy birthday babi ${age} tuổi. 💜 ${birthdayBodies[((k%birthdayBodies.length)+birthdayBodies.length)%birthdayBodies.length]} ${birthdayMotifs[((k%birthdayMotifs.length)+birthdayMotifs.length)%birthdayMotifs.length]} Chúc mừng sinh nhật em. 💜`}}
