<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4eaf5" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Hộp lời chúc cho babi 💜</title>
  <style>
    :root{
      --bg:#f5eef6;
      --paper:#fffdfd;
      --ink:#5c4864;
      --muted:#9a859f;
      --lav:#b99bc3;
      --lav2:#d9c7df;
      --pink:#e6bacd;
      --pink2:#f5dce7;
      --line:#d6c6da;
      --shadow:0 18px 55px rgba(83,58,90,.12);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{
      font-family:Inter, ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255,255,255,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 87% 18%, rgba(255,255,255,.75) 0 2px, transparent 3px),
        linear-gradient(180deg,#f8f3f8 0%,#f3e9f4 55%,#f5edf4 100%);
      overflow-x:hidden;
    }
    button{font:inherit}
    .app{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:18px;
      position:relative;
    }
    .shell{
      width:min(620px,100%);
      background:rgba(255,253,253,.92);
      border:1px solid rgba(185,155,195,.7);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:30px 22px 24px;
      backdrop-filter:blur(8px);
    }
    .top{
      text-align:center;
      margin-bottom:22px;
    }
    .eyebrow{
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:11px;
      font-weight:800;
      color:var(--muted);
      margin-bottom:9px;
    }
    h1{
      margin:0;
      font-size:clamp(30px,7vw,44px);
      line-height:1.1;
      letter-spacing:-.02em;
      font-weight:800;
    }
    .subtitle{
      margin:11px auto 0;
      max-width:460px;
      color:var(--muted);
      font-size:15px;
      line-height:1.6;
    }
    .today-btn{
      display:block;
      margin:20px auto 0;
      border:1px solid #765b7d;
      background:#765b7d;
      color:#fff;
      padding:12px 18px;
      border-radius:999px;
      font-weight:800;
      box-shadow:0 7px 0 rgba(92,72,100,.10);
      cursor:pointer;
    }
    .today-btn:active{transform:translateY(2px)}
    .grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:9px;
      margin-top:22px;
    }
    .day{
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      min-height:78px;
      padding:10px 6px 8px;
      cursor:pointer;
      color:var(--ink);
      transition:.18s ease;
    }
    .day:hover{transform:translateY(-2px)}
    .day.active{
      border-color:#8d6d96;
      background:linear-gradient(180deg,#fff,#fbf3f7);
      box-shadow:0 8px 22px rgba(95,70,104,.10);
    }
    .day .short{
      display:block;
      font-weight:900;
      font-size:13px;
    }
    .day .heart{
      display:block;
      font-size:17px;
      margin-top:7px;
      opacity:.45;
    }
    .day.active .heart{opacity:1}
    .day .tiny{
      display:block;
      margin-top:5px;
      font-size:9px;
      color:var(--muted);
      min-height:11px;
    }

    .box{
      margin-top:20px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,#fffefe 0%,#fff9fc 100%);
      border-radius:22px;
      padding:20px;
      min-height:250px;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:center;
      text-align:center;
    }
    .box:before{
      content:"";
      position:absolute;
      width:160px;height:160px;
      border-radius:50%;
      background:rgba(230,186,205,.14);
      top:-90px;right:-70px;
    }
    .box:after{
      content:"";
      position:absolute;
      width:140px;height:140px;
      border-radius:50%;
      background:rgba(185,155,195,.11);
      bottom:-90px;left:-70px;
    }
    .gift{
      position:relative;
      z-index:1;
      font-size:42px;
      margin-bottom:11px;
    }
    .day-title{
      position:relative;
      z-index:1;
      font-size:12px;
      font-weight:900;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:12px;
    }
    .wish{
      position:relative;
      z-index:1;
      font-family:Georgia, "Times New Roman", serif;
      font-size:clamp(20px,5.4vw,27px);
      line-height:1.55;
      max-width:500px;
      margin:0 auto;
      opacity:0;
      transform:translateY(6px);
      transition:.25s ease;
    }
    .wish.show{
      opacity:1;
      transform:none;
    }
    .hint{
      position:relative;
      z-index:1;
      margin-top:16px;
      color:var(--muted);
      font-size:12px;
    }
    .signature{
      text-align:center;
      margin-top:22px;
      font-family:Georgia, "Times New Roman", serif;
      font-style:italic;
      color:#8e7496;
      font-size:14px;
    }
    .footer{
      text-align:center;
      font-size:10px;
      color:#b5a3b9;
      margin-top:13px;
      letter-spacing:.08em;
    }
    @media(max-width:560px){
      .app{padding:10px}
      .shell{padding:25px 14px 20px;border-radius:22px}
      .grid{gap:6px}
      .day{min-height:70px;border-radius:13px;padding:9px 3px 7px}
      .day .short{font-size:11px}
      .day .heart{font-size:15px}
      .day .tiny{font-size:8px}
      .box{padding:18px 15px;min-height:260px}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="shell">
      <div class="top">
        <div class="eyebrow">7 little wishes</div>
        <h1>Hộp lời chúc cho babi 💜</h1>
        <p class="subtitle">Mỗi ngày một lời chúc nhỏ. Không cần trả lời gì hết — mở ra khi em muốn thôi.</p>
        <button class="today-btn" id="todayBtn">Mở lời chúc hôm nay</button>
      </div>

      <div class="grid" id="dayGrid">
        <button class="day" data-day="1"><span class="short">T2</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="2"><span class="short">T3</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="3"><span class="short">T4</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="4"><span class="short">T5</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="5"><span class="short">T6</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="6"><span class="short">T7</span><span class="heart">♡</span><span class="tiny"></span></button>
        <button class="day" data-day="0"><span class="short">CN</span><span class="heart">♡</span><span class="tiny"></span></button>
      </div>

      <div class="box">
        <div class="gift" id="gift">🎁</div>
        <div class="day-title" id="dayTitle">Một lời chúc đang đợi em</div>
        <p class="wish" id="wish">Bấm vào một ngày ở trên để mở nha.</p>
        <div class="hint" id="hint">Mỗi ngày đều có một cái nhỏ xíu dành cho em.</div>
      </div>

      <div class="signature">for babi, from Papa 💜</div>
      <div class="footer">made to be opened gently</div>
    </section>
  </main>

  <script>
    const wishes = {
      1:{
        title:"Thứ Hai",
        icon:"🌷",
        text:"Chúc babi bắt đầu tuần mới thật nhẹ. Việc gì khó thì làm từ từ, việc gì mệt thì để nó nhẹ lại một chút. Mong hôm nay đối xử với em thật dịu dàng."
      },
      2:{
        title:"Thứ Ba",
        icon:"☁️",
        text:"Chúc hôm nay có một điều nhỏ xíu làm em vui bất ngờ — một món ngon, một câu nói dễ thương, hay đơn giản là một khoảnh khắc em thấy lòng mình nhẹ tênh."
      },
      3:{
        title:"Thứ Tư",
        icon:"🫧",
        text:"Giữa tuần rồi. Chúc em vẫn còn đủ năng lượng cho những điều em muốn làm, và đủ dịu dàng với chính mình cho những điều chưa kịp làm."
      },
      4:{
        title:"Thứ Năm",
        icon:"🍰",
        text:"Chúc em gặp nhiều điều tử tế hơn những điều làm em mệt. Và nếu hôm nay không hoàn hảo, thì ít nhất mong nó vẫn có một đoạn thật ngon, thật vui, thật đáng nhớ."
      },
      5:{
        title:"Thứ Sáu",
        icon:"✨",
        text:"Chúc em khép lại tuần này với cảm giác: mình đã cố gắng đủ rồi. Phần còn lại để ngày mai tính. Tối nay cứ vui trước đã nha."
      },
      6:{
        title:"Thứ Bảy",
        icon:"🎀",
        text:"Chúc hôm nay là một ngày thật xinh — được đi nơi em thích, ăn món em muốn, làm điều em vui, và không cần vội với bất kỳ ai."
      },
      0:{
        title:"Chủ Nhật",
        icon:"🌙",
        text:"Chúc em có một ngày để thở thật sâu, nghỉ thật yên, và làm đầy lại những phần đã hơi mệt trong tuần. Ngày mai tính sau. Hôm nay cứ bình yên trước đã. 💜"
      }
    };

    const dayButtons = [...document.querySelectorAll(".day")];
    const wishEl = document.getElementById("wish");
    const titleEl = document.getElementById("dayTitle");
    const giftEl = document.getElementById("gift");
    const hintEl = document.getElementById("hint");
    const todayBtn = document.getElementById("todayBtn");

    const today = new Date().getDay();

    function markToday(){
      dayButtons.forEach(btn=>{
        const d = Number(btn.dataset.day);
        const tiny = btn.querySelector(".tiny");
        tiny.textContent = d === today ? "hôm nay" : "";
      });
    }

    function openWish(day){
      const data = wishes[day];
      if(!data) return;
      dayButtons.forEach(btn=>btn.classList.toggle("active",Number(btn.dataset.day)===day));
      wishEl.classList.remove("show");
      setTimeout(()=>{
        titleEl.textContent = data.title;
        giftEl.textContent = data.icon;
        wishEl.textContent = data.text;
        hintEl.textContent = day===today ? "Lời chúc của hôm nay 💜" : "Lời chúc nhỏ của ngày này.";
        wishEl.classList.add("show");
      },120);
    }

    dayButtons.forEach(btn=>{
      btn.addEventListener("click",()=>openWish(Number(btn.dataset.day)));
    });

    todayBtn.addEventListener("click",()=>openWish(today));

    markToday();
    setTimeout(()=>openWish(today),250);
  </script>
</body>
</html>
